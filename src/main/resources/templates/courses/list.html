<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold mb-0"><i class="fa-solid fa-graduation-cap me-2"></i>Quản lý khóa học</h2>
        <a th:href="@{/courses/create}" class="btn btn-success"><i class="fa-solid fa-plus me-1"></i>Thêm khóa học mới</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${feeError}" class="alert alert-danger" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-1"></i><span th:text="${feeError}"></span>
    </div>

    <!-- BỘ LỌC VÀ TÌM KIẾM -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/courses}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Tìm kiếm tên khóa học</label>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên khóa học...">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Loại khóa học</label>
                    <select name="categoryId" class="form-select">
                        <option value="">-- Tất cả loại --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">Trạng thái</label>
                    <select name="isActive" class="form-select">
                        <option value="">-- Tất cả --</option>
                        <option value="true" th:selected="${isActive == true}">Đang tuyển sinh</option>
                        <option value="false" th:selected="${isActive == false}">Ngừng tuyển sinh</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">Học phí từ</label>
                    <input type="number" step="any" name="minFee" th:value="${minFee}" class="form-control" placeholder="Tối thiểu">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">Học phí đến</label>
                    <input type="number" step="any" name="maxFee" th:value="${maxFee}" class="form-control" placeholder="Tối đa">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Sắp xếp theo</label>
                    <select name="sort" class="form-select">
                        <option value="none">-- Mặc định --</option>
                        <option value="feeAsc" th:selected="${sort == 'feeAsc'}">Học phí tăng dần</option>
                        <option value="feeDesc" th:selected="${sort == 'feeDesc'}">Học phí giảm dần</option>
                        <option value="durationAsc" th:selected="${sort == 'durationAsc'}">Thời lượng tăng dần</option>
                    </select>
                </div>
                <div class="col-md-9 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-filter me-1"></i>Tìm kiếm & Lọc</button>
                    <a th:href="@{/courses}" class="btn btn-outline-secondary"><i class="fa-solid fa-rotate-left me-1"></i>Đặt lại</a>
                </div>
            </form>
        </div>
    </div>

    <!-- BẢNG DANH SÁCH -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Ảnh đại diện</th>
                            <th>Tên khóa học</th>
                            <th>Loại</th>
                            <th>Học phí</th>
                            <th>Thời lượng</th>
                            <th>Phân loại</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="8" class="text-center py-4 text-muted">
                                <i class="fa-regular fa-folder-open fa-2x mb-2 d-block"></i>
                                Tìm kiếm không có kết quả.
                            </td>
                        </tr>
                        <tr th:each="c : ${courses}">
                            <td style="width: 100px;">
                                <div th:if="${c.thumbnail != null}">
                                    <img th:src="${c.thumbnail.imageUrl}" class="rounded" style="width: 80px; height: 50px; object-fit: cover;" alt="Thumbnail">
                                </div>
                                <span th:if="${c.thumbnail == null}" class="badge bg-secondary">Khóa học chưa có ảnh</span>
                            </td>
                            <td class="fw-bold" th:text="${c.name}"></td>
                            <td><span class="badge bg-info text-dark" th:text="${c.category.name}"></span></td>
                            <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(c.tuitionFee, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                            <td th:text="${c.duration + ' giờ'}"></td>
                            <td>
                                <span th:if="${c.durationType == 'Ngắn hạn'}" class="badge bg-warning text-dark">Ngắn hạn</span>
                                <span th:if="${c.durationType == 'Dài hạn'}" class="badge bg-primary">Dài hạn</span>
                            </td>
                            <td>
                                <span th:if="${c.isActive}" class="badge bg-success">Đang tuyển sinh</span>
                                <span th:if="${!c.isActive}" class="badge bg-secondary">Ngừng tuyển sinh</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/courses/detail/{id}(id=${c.id})}" class="btn btn-sm btn-outline-info me-1">
                                    <i class="fa-solid fa-images"></i> Chi tiết
                                </a>
                                <a th:href="@{/courses/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-warning">
                                    <i class="fa-solid fa-pen-to-square"></i> Sửa
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
