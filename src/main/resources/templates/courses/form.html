<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${course.id == null ? 'Thêm mới khóa học' : 'Cập nhật khóa học'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${course.id == null ? 'Tạo mới khóa học' : 'Cập nhật khóa học'}"></h4>
        </div>
        <div class="card-body">
            <div th:if="${customError}" class="alert alert-danger" th:text="${customError}"></div>

            <form th:action="@{/courses/save}" th:object="${course}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Tên khóa học <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Loại khóa học <span class="text-danger">*</span></label>
                    <select th:field="*{category.id}" class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                        <option value="">-- Chọn loại khóa học --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{category}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Học phí (VNĐ) <span class="text-danger">*</span></label>
                        <input type="number" step="any" th:field="*{tuitionFee}" class="form-control" th:classappend="${#fields.hasErrors('tuitionFee')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{tuitionFee}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Thời lượng (giờ) <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{duration}" class="form-control" th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{duration}"></div>
                    </div>
                </div>

                <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="activeSwitch">
                    <label class="form-check-label fw-bold" for="activeSwitch">Đang mở tuyển sinh</label>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Mô tả chi tiết</label>
                    <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/courses}" class="btn btn-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-success">Lưu khóa học</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
