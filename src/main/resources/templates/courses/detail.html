<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết & Quản lý ảnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="mb-3">
        <a th:href="@{/courses}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i>Quay lại danh sách</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3 class="fw-bold text-primary" th:text="${course.name}"></h3>
            <p class="text-muted mb-2">Loại: <strong th:text="${course.category.name}"></strong></p>
            <p class="mb-1">Học phí: <strong class="text-danger" th:text="${#numbers.formatDecimal(course.tuitionFee, 0, 'COMMA', 0, 'POINT') + ' đ'}"></strong></p>
            <p class="mb-1">Thời lượng: <strong th:text="${course.duration + ' giờ (' + course.durationType + ')'}"></strong></p>
            <p class="mb-1">Trạng thái: 
                <span th:if="${course.isActive}" class="badge bg-success">Đang tuyển sinh</span>
                <span th:if="${!course.isActive}" class="badge bg-secondary">Ngừng tuyển sinh</span>
            </p>
            <p class="mt-2 text-secondary" th:text="${course.description}"></p>
        </div>
    </div>

    <!-- BỘ SƯU TẬP HÌNH ẢNH CỦA KHÓA HỌC -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fa-solid fa-photo-film me-2"></i>Bộ sưu tập hình ảnh</h5>
            <span class="badge bg-light text-dark" th:text="${#lists.size(course.images) + ' hình ảnh'}"></span>
        </div>
        <div class="card-body">
            <!-- Thêm ảnh bằng URL -->
            <form th:action="@{/courses/detail/{id}/add-image(id=${course.id})}" method="post" class="row g-2 mb-4 border p-3 rounded bg-white">
                <div class="col-md-8">
                    <input type="url" name="imageUrl" class="form-control" placeholder="Dán đường dẫn ảnh (URL) vào đây..." required>
                </div>
                <div class="col-md-2 d-flex align-items-center">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="isThumbnail" value="true" id="isThumbCheck">
                        <label class="form-check-label" for="isThumbCheck">Đặt làm đại diện</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-plus me-1"></i>Thêm ảnh</button>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(course.images)}" class="text-center py-4 text-muted">
                <p>Khóa học chưa có ảnh nào.</p>
            </div>

            <!-- Grid hiển thị danh sách tất cả ảnh -->
            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3">
                <div class="col" th:each="img : ${course.images}">
                    <div class="card h-100 shadow-sm border position-relative" th:classappend="${img.isThumbnail} ? 'border-success border-3'">
                        <img th:src="${img.imageUrl}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="Course image" onerror="this.src='https://via.placeholder.com/300x200?text=Loi+Anh'">
                        <div class="card-body p-2 text-center">
                            <span th:if="${img.isThumbnail}" class="badge bg-success mb-2"><i class="fa-solid fa-check me-1"></i>Ảnh đại diện</span>
                            <span th:if="${!img.isThumbnail}" class="badge bg-light text-muted mb-2">Ảnh thường</span>
                            
                            <!-- Đổi ảnh đại diện: khi bấm, ảnh cũ tự động thành ảnh thường -->
                            <form th:if="${!img.isThumbnail}" th:action="@{/courses/images/set-thumbnail/{imageId}(imageId=${img.id})}" method="post">
                                <input type="hidden" name="courseId" th:value="${course.id}">
                                <button type="submit" class="btn btn-sm btn-outline-success w-100">
                                    <i class="fa-solid fa-star me-1"></i>Đặt làm đại diện
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
